[project]
name = "linq-common"
version = "0.1.0"
description = "Общая библиотека сервисов: контракты сообщений, шина Redis, JWT, метрики, логи"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "minio>=7.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*"]
