<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Решение как чёрный ящик: видео с камер на входе, оповещение о нарушении на выходе, нейросети считаются на LinQ TPU"><title>Решение как чёрный ящик: видео с камер на входе, оповещение о нарушении на выходе, нейросети считаются на LinQ TPU</title><defs><marker id="d1-ah17212F" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#17212F"/></marker><marker id="d1-ah7D8796" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#7D8796"/></marker><marker id="d1-ahB86E00" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#B86E00"/></marker><marker id="d1-ahD33F35" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#D33F35"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="78" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#2F64D6" text-anchor="start" letter-spacing="2.5">СХЕМА 1 · ОБЗОР</text><text x="64" y="128" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#17212F" text-anchor="start">Как работает решение</text><text x="64" y="168" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#5B6676" text-anchor="start">Видео с камер на входе, оповещение о нарушении техники безопасности на выходе</text><text x="64" y="330" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B6676" text-anchor="start" letter-spacing="2">ВХОД</text><text x="1440" y="312" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#5B6676" text-anchor="start" letter-spacing="2">ВЫХОД</text><rect x="64" y="368" width="360" height="100" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="84" y="407.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Камеры цеха</text><text x="84" y="439.72" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">RTSP-поток с IP-камеры</text><path d="M424.0,418.0 L608.0,418.0" fill="none" stroke="#17212F" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ah17212F)"/><rect x="64" y="492" width="360" height="100" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="84" y="531.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Видеозаписи</text><text x="84" y="563.7199999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">файл, проигрывается по кругу</text><path d="M424.0,542.0 L608.0,542.0" fill="none" stroke="#17212F" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ah17212F)"/><rect x="64" y="616" width="360" height="100" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="84" y="655.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Наборы кадров</text><text x="84" y="687.7199999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">папка с фотографиями</text><path d="M424.0,666.0 L608.0,666.0" fill="none" stroke="#17212F" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ah17212F)"/><rect x="690" y="198" width="480" height="86" rx="14" fill="#FFFFFF" stroke="#A9B3C1" stroke-width="2"/><text x="708" y="234.38" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#17212F" text-anchor="start">Специалист по охране труда</text><text x="708" y="265.52" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">рисует зоны, включает правила и расписание</text><path d="M930.0,284.0 L930.0,318.0" fill="none" stroke="#7D8796" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#d1-ah7D8796)"/><text x="944" y="314" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#7D8796" text-anchor="start">настройка</text><rect x="620" y="330" width="620" height="420" rx="18" fill="#17212F"/><text x="660" y="380" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#8E9BB0" text-anchor="start" letter-spacing="2.5">ЧЁРНЫЙ ЯЩИК</text><text x="660" y="432" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Система видеоконтроля ТБ</text><text x="660" y="474" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#C9D2DE" text-anchor="start">находит нарушения на каждом кадре</text><text x="660" y="502" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#C9D2DE" text-anchor="start">и решает, когда поднять тревогу</text><text x="660" y="556" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#8E9BB0" text-anchor="start" letter-spacing="2">РАСПОЗНАЁТ СЕЙЧАС</text><rect x="660" y="574" width="243.76000000000002" height="40" rx="20.0" fill="#223047" stroke="#3B4B63" stroke-width="1.5"/><text x="781.88" y="600.48" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">Человек в опасной зоне</text><rect x="660" y="624" width="304.24" height="40" rx="20.0" fill="#223047" stroke="#3B4B63" stroke-width="1.5"/><text x="812.12" y="650.48" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">Опасное сближение с техникой</text><rect x="660" y="674" width="163.12" height="40" rx="20.0" fill="#223047" stroke="#3B4B63" stroke-width="1.5"/><text x="741.56" y="700.48" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">Телефон в руке</text><rect x="1044.4" y="316" width="181.6" height="28" rx="14" fill="#FFFFFF" stroke="#17212F" stroke-width="1.5"/><text x="1135.2" y="335" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#17212F" text-anchor="middle">подробно: схема 2 →</text><rect x="730" y="812" width="400" height="130" rx="14" fill="#FFF3DE" stroke="#E8A33A" stroke-width="2"/><text x="750" y="855.84" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#B86E00" text-anchor="start">LinQ TPU</text><text x="750" y="888.4" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B4A1A" text-anchor="start">российский ускоритель нейросетей</text><text x="750" y="913.9599999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B4A1A" text-anchor="start">стенд LinQ, связь через VPN</text><path d="M880.0,750.0 L880.0,800.0" fill="none" stroke="#B86E00" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ahB86E00)"/><text x="866" y="790" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#B86E00" text-anchor="end">кадр</text><path d="M980.0,812.0 L980.0,762.0" fill="none" stroke="#B86E00" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ahB86E00)"/><text x="994" y="790" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#B86E00" text-anchor="start">люди, позы, техника</text><rect x="1440" y="330" width="420" height="160" rx="14" fill="#FDECEA" stroke="#D33F35" stroke-width="2"/><text x="1460" y="370.72" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#B3261E" text-anchor="start">Оповещение</text><text x="1460" y="403.28000000000003" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B2A26" text-anchor="start">диспетчеру и мастеру участка</text><text x="1460" y="428.84000000000003" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B2A26" text-anchor="start">кадр с рамкой, клип, камера, время</text><text x="1460" y="454.40000000000003" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B2A26" text-anchor="start">в браузере со звуком и в Telegram</text><rect x="1440" y="518" width="420" height="104" rx="14" fill="#FFFFFF" stroke="#A9B3C1" stroke-width="2"/><text x="1460" y="558.72" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#17212F" text-anchor="start">Журнал</text><text x="1460" y="591.28" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">история, статусы, кто что сделал</text><rect x="1440" y="646" width="420" height="104" rx="14" fill="#FFFFFF" stroke="#A9B3C1" stroke-width="2"/><text x="1460" y="686.72" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#17212F" text-anchor="start">Дашборд</text><text x="1460" y="719.28" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">где и когда нарушают чаще</text><path d="M1240.0,410.0 L1428.0,410.0" fill="none" stroke="#D33F35" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#d1-ahD33F35)"/><path d="M1240.0,570.0 L1428.0,570.0" fill="none" stroke="#17212F" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ah17212F)"/><path d="M1240.0,698.0 L1428.0,698.0" fill="none" stroke="#17212F" stroke-width="3" stroke-linejoin="round" marker-end="url(#d1-ah17212F)"/><line x1="64" y1="968" x2="1856" y2="968" stroke="#C3CBD6" stroke-width="1.5"/><text x="64" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#17212F" text-anchor="start">835 мс</text><text x="196.39999999999998" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6676" text-anchor="start">кадр проходит обе нейросети на TPU</text><text x="680" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#17212F" text-anchor="start">1,6 с</text><text x="792.0" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6676" text-anchor="start">от начала сближения с техникой до тревоги</text><text x="1296" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#17212F" text-anchor="start">1 → 1</text><text x="1408.0" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6676" text-anchor="start">одно нарушение — одно оповещение</text></svg>