<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Подготовка моделей: данные, обучение, экспорт ONNX, разрез графа, калибровка и INT8, компиляция под TPU_H1M, загрузка на стенд; проверки на каждом шаге"><title>Подготовка моделей: данные, обучение, экспорт ONNX, разрез графа, калибровка и INT8, компиляция под TPU_H1M, загрузка на стенд; проверки на каждом шаге</title><defs><marker id="d6-ah2F64D6" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2F64D6"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="78" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#2F64D6" text-anchor="start" letter-spacing="2.5">СХЕМА 6 · ОТКУДА БЕРУТСЯ НЕЙРОСЕТИ ДЛЯ TPU</text><text x="64" y="128" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#17212F" text-anchor="start">Как модель попадает на LinQ TPU</text><text x="64" y="168" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#5B6676" text-anchor="start">Обучаем у себя, квантуем и компилируем в Docker с SDK LinQ 2026.9.45, программу кладём на стенд</text><rect x="40" y="200" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="78" cy="240" r="18" fill="#17212F"/><text x="78" y="247" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="108" y="248" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Данные</text><text x="62" y="292" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">LOCO (склады): погрузчик, рохля</text><text x="62" y="318" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">COCO: телефон в руке</text><text x="62" y="344" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">9 120 рамок для обучения</text><text x="62" y="370" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">проверка — на другом складе</text><rect x="510" y="200" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="548" cy="240" r="18" fill="#17212F"/><text x="548" y="247" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="578" y="248" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Обучение</text><text x="532" y="292" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">YOLOv8s на своей GPU</text><text x="532" y="318" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">ранняя остановка: 19-я эпоха из 34</text><text x="532" y="344" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">поза: готовая YOLOv8n-pose</text><rect x="980" y="200" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="1018" cy="240" r="18" fill="#17212F"/><text x="1018" y="247" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="1048" y="248" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Экспорт в ONNX</text><text x="1002" y="292" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">вход фиксирован: 1×3×640×640</text><text x="1002" y="318" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">TPU не умеет динамические формы</text><text x="1002" y="344" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">NMS и декодирование — вне графа</text><rect x="1450" y="200" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="1488" cy="240" r="18" fill="#17212F"/><text x="1488" y="247" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1518" y="248" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Разрез графа</text><rect x="1472" y="270" width="236" height="40" rx="8" fill="#FFF3DE" stroke="#E8A33A" stroke-width="2"/><text x="1590" y="296" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#B86E00" text-anchor="middle">тело сети → TPU</text><rect x="1714" y="270" width="144" height="40" rx="8" fill="#EEF0F3" stroke="#B4BCC7" stroke-width="2"/><text x="1786.0" y="296" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#3A4554" text-anchor="middle">хвост → CPU</text><text x="1472" y="344" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">DFL-декод и сигмоида — в ONNX-хвост,</text><text x="1472" y="370" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">сверяем с полной моделью</text><path d="M470.0,300.0 L498.0,300.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><path d="M940.0,300.0 L968.0,300.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><path d="M1410.0,300.0 L1438.0,300.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><path d="M1665.0,400.0 L1665.0,435.0 L255.0,435.0 L255.0,458.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><rect x="40" y="470" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="78" cy="510" r="18" fill="#17212F"/><text x="78" y="517" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="108" y="518" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Калибровка и INT8</text><text x="62" y="562" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">160 реальных кадров из обучения</text><text x="62" y="588" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">отсечение выбросов активаций</text><text x="62" y="614" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">(перцентиль 99,9)</text><text x="62" y="640" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">эмулятор INT8 — без стенда</text><rect x="510" y="470" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="548" cy="510" r="18" fill="#17212F"/><text x="548" y="517" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="578" y="518" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Компиляция под TPU_H1M</text><text x="532" y="562" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">пресет O5, при ошибке — O1</text><text x="532" y="588" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">batch = 1, программа .tpu</text><text x="532" y="614" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">хэш содержимого в имени файла</text><rect x="980" y="470" width="430" height="200" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><circle cx="1018" cy="510" r="18" fill="#17212F"/><text x="1018" y="517" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="1048" y="518" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">На стенд LinQ</text><text x="1002" y="562" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">программа → /auto/cache/&lt;логин&gt;/</text><text x="1002" y="588" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">meta.json и ONNX-хвост → воркеры</text><text x="1002" y="614" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">запуск воркеров одним скриптом</text><rect x="1450" y="470" width="430" height="200" rx="14" fill="#FFF3DE" stroke="#E8A33A" stroke-width="2"/><text x="1472" y="518" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#B86E00" text-anchor="start">2 программы для TPU</text><text x="1472" y="556" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#17212F" text-anchor="start">yolov8n_pose_b1_o1_h1m.tpu</text><text x="1472" y="578" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B4A1A" text-anchor="start">люди и 17 точек скелета</text><text x="1472" y="614" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#17212F" text-anchor="start">yolov8s_objects_b1_o1_h1m_1b310853.tpu</text><text x="1472" y="636" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B4A1A" text-anchor="start">погрузчик, рохля, телефон</text><path d="M470.0,570.0 L498.0,570.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><path d="M940.0,570.0 L968.0,570.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><path d="M1410.0,570.0 L1438.0,570.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d6-ah2F64D6)"/><rect x="40" y="730" width="900" height="316" rx="20" fill="#F3F6FA" stroke="#DCE3EC" stroke-width="1.5"/><text x="64" y="762" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5B6676"><tspan font-weight="600" letter-spacing="1.6">ПРОВЕРКА НА КАЖДОМ ШАГЕ</tspan></text><circle cx="84" cy="799" r="16" fill="#E5F3EA" stroke="#2E8B57" stroke-width="2"/><path d="M76,799 l6,6 l10,-12" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linejoin="round"/><text x="114" y="806" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="start">Тело + хвост = полная модель</text><text x="114" y="832" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">verify_split на реальных кадрах, CPU</text><circle cx="84" cy="879" r="16" fill="#E5F3EA" stroke="#2E8B57" stroke-width="2"/><path d="M76,879 l6,6 l10,-12" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linejoin="round"/><text x="114" y="886" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="start">Эмулятор INT8 повторяет TPU</text><text x="114" y="912" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">подбор квантования без очереди стенда</text><circle cx="84" cy="959" r="16" fill="#E5F3EA" stroke="#2E8B57" stroke-width="2"/><path d="M76,959 l6,6 l10,-12" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linejoin="round"/><text x="114" y="966" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="start">TPU = CPU на стенде</text><text x="114" y="992" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">те же рамки, уверенность ±0,05</text><rect x="980" y="730" width="900" height="316" rx="20" fill="#FFF9EF" stroke="#F2DDB5" stroke-width="1.5"/><text x="1004" y="762" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="15" fill="#B86E00"><tspan font-weight="600" letter-spacing="1.6">ЧТО НАШЛИ И ИСПРАВИЛИ</tspan></text><text x="1004" y="800" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">С калибровкой по умолчанию TPU не видел технику:</text><text x="1004" y="826" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#3A4554" text-anchor="start">логиты классов совпадали с float-моделью лишь на 0,65.</text><text x="1004" y="868" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#5B6676" text-anchor="start" letter-spacing="1.5">КОРРЕЛЯЦИЯ ЛОГИТОВ TPU И FLOAT-МОДЕЛИ</text><line x1="1180" y1="882" x2="1180" y2="970" stroke="#C3CBD6" stroke-width="1.5"/><text x="1166" y="908" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#3A4554" text-anchor="end">по умолчанию</text><rect x="1180" y="888" width="364.0" height="28" rx="6" fill="#FDECEA" stroke="#D33F35" stroke-width="2"/><text x="1554.0" y="909" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#D33F35" text-anchor="start">0,65</text><text x="1166" y="948" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#3A4554" text-anchor="end">отсечение 99,9</text><rect x="1180" y="928" width="548.8" height="28" rx="6" fill="#E5F3EA" stroke="#2E8B57" stroke-width="2"/><text x="1738.8" y="949" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#2E8B57" text-anchor="start">0,98</text><text x="1180" y="988" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6676" text-anchor="middle">0</text><text x="1740" y="988" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6676" text-anchor="middle">1</text><text x="1004" y="1024" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">Отсекли 0,1 % самых больших активаций при калибровке — TPU снова видит технику.</text></svg>