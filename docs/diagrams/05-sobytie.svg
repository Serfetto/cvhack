<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="После подтверждения: кадр с рамкой и клип сохраняются в MinIO, событие пишется в журнал, оповещение уходит людям по роли и участку, статусы и эскалация"><title>После подтверждения: кадр с рамкой и клип сохраняются в MinIO, событие пишется в журнал, оповещение уходит людям по роли и участку, статусы и эскалация</title><defs><marker id="d5-ah2F64D6" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2F64D6"/></marker><marker id="d5-ah7D8796" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#7D8796"/></marker><marker id="d5-ah17212F" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#17212F"/></marker><marker id="d5-ahD33F35" viewBox="0 0 14 12" refX="2" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#D33F35"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="64" y="78" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#2F64D6" text-anchor="start" letter-spacing="2.5">СХЕМА 5 · ВНУТРИ БЛОКОВ «ЖУРНАЛ» И «ОПОВЕЩЕНИЯ»</text><text x="64" y="128" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#17212F" text-anchor="start">Что происходит после подтверждения нарушения</text><text x="64" y="168" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#5B6676" text-anchor="start">Доказательства сохраняются сразу, оповещение получают те, кому оно нужно, а без реакции включается эскалация</text><rect x="40" y="210" width="320" height="170" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><text x="60" y="249.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Анализ</text><text x="60" y="274.15999999999997" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="500" fill="#2F64D6" text-anchor="start">analytics</text><text x="60" y="305.29999999999995" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">нарушение подтверждено</text><text x="60" y="329.43999999999994" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">рисует рамку и зону</text><text x="60" y="353.5799999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">на кадре</text><rect x="470" y="210" width="400" height="170" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><text x="490" y="249.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Журнал</text><text x="490" y="274.15999999999997" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="500" fill="#2F64D6" text-anchor="start">events</text><text x="490" y="305.29999999999995" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">запись в PostgreSQL</text><text x="490" y="329.43999999999994" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">SHA-256 кадра для проверок</text><text x="490" y="353.5799999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">запрос клипа ±5 с</text><rect x="980" y="210" width="400" height="170" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><text x="1000" y="249.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Оповещения</text><text x="1000" y="274.15999999999997" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="500" fill="#2F64D6" text-anchor="start">notifications</text><text x="1000" y="305.29999999999995" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">WebSocket: звук для критичных</text><text x="1000" y="329.43999999999994" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">Telegram с кадром</text><text x="1000" y="353.5799999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">фильтр по роли и участку</text><rect x="470" y="540" width="400" height="150" rx="14" fill="#FFFFFF" stroke="#2F64D6" stroke-width="2"/><text x="490" y="579.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#17212F" text-anchor="start">Захват видео</text><text x="490" y="604.16" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="500" fill="#2F64D6" text-anchor="start">ingest</text><text x="490" y="635.3" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">кольцевой буфер 20 с</text><text x="490" y="659.4399999999999" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">собирает MP4 (H.264)</text><path d="M40,554 A160.0,14 0 0 1 360,554 L360,676 A160.0,14 0 0 1 40,676 Z" fill="#F6F7F9" stroke="#AEB7C3" stroke-width="2" stroke-linejoin="round"/><path d="M40,554 A160.0,14 0 0 0 360,554" fill="none" stroke="#AEB7C3" stroke-width="2" stroke-linejoin="round"/><text x="200.0" y="598" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" fill="#17212F" text-anchor="middle">MinIO</text><text x="200.0" y="622" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4554" text-anchor="middle">кадр с рамкой</text><text x="200.0" y="646" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4554" text-anchor="middle">клип MP4</text><path d="M360.0,295.0 L458.0,295.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d5-ah2F64D6)"/><text x="415" y="283" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#2F64D6" text-anchor="middle">нарушение</text><path d="M870.0,295.0 L968.0,295.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d5-ah2F64D6)"/><text x="925" y="283" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#2F64D6" text-anchor="middle">событие</text><path d="M200.0,380.0 L200.0,528.0" fill="none" stroke="#7D8796" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#d5-ah7D8796)"/><text x="214" y="466" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#7D8796" text-anchor="start">кадр с рамкой</text><path d="M620.0,380.0 L620.0,528.0" fill="none" stroke="#7D8796" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#d5-ah7D8796)"/><text x="608" y="466" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#7D8796" text-anchor="end">запрос клипа</text><path d="M720.0,540.0 L720.0,392.0" fill="none" stroke="#7D8796" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#d5-ah7D8796)"/><text x="732" y="466" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#7D8796" text-anchor="start">клип готов</text><path d="M470.0,615.0 L372.0,615.0" fill="none" stroke="#7D8796" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#d5-ah7D8796)"/><text x="415" y="603" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#7D8796" text-anchor="middle">клип</text><rect x="1490" y="200" width="390" height="92" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="1508" y="235.6" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#17212F" text-anchor="start">Диспетчер</text><text x="1508" y="266.74" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">все события, передаёт мастеру</text><rect x="1490" y="308" width="390" height="92" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="1508" y="343.6" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#17212F" text-anchor="start">Мастер участка</text><text x="1508" y="374.74" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">только свой участок</text><rect x="1490" y="416" width="390" height="92" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="1508" y="451.6" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#17212F" text-anchor="start">Охрана труда, руководитель</text><text x="1508" y="482.74" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#3A4554" text-anchor="start">журнал, дашборд, эскалации</text><path d="M1380,295 H1435 M1435,246 V462" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round"/><path d="M1435.0,246.0 L1478.0,246.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d5-ah2F64D6)"/><path d="M1435.0,354.0 L1478.0,354.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d5-ah2F64D6)"/><path d="M1435.0,462.0 L1478.0,462.0" fill="none" stroke="#2F64D6" stroke-width="3" stroke-linejoin="round" marker-end="url(#d5-ah2F64D6)"/><rect x="1490" y="540" width="390" height="170" rx="14" fill="#FDECEA" stroke="#D33F35" stroke-width="2"/><text x="1508" y="575.6" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#B3261E" text-anchor="start">В оповещении</text><text x="1508" y="606.74" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#5B2A26" text-anchor="start">тип и важность нарушения</text><text x="1508" y="630.88" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#5B2A26" text-anchor="start">камера, зона, время</text><text x="1508" y="655.02" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#5B2A26" text-anchor="start">кадр с рамкой — сразу</text><text x="1508" y="679.16" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#5B2A26" text-anchor="start">клип — следом, через 5–10 с</text><rect x="40" y="728" width="1840" height="328" rx="20" fill="#F3F6FA" stroke="#DCE3EC" stroke-width="1.5"/><text x="64" y="760" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5B6676"><tspan font-weight="600" letter-spacing="1.6">РАЗБОР СОБЫТИЯ</tspan><tspan dx="14" font-weight="400">каждое действие пишется в историю: кто, что и когда</tspan></text><rect x="110" y="850" width="200" height="50" rx="25" fill="#EAF0FC" stroke="#2F64D6" stroke-width="2"/><text x="210.0" y="882" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="middle">Новое</text><rect x="560" y="784" width="260" height="50" rx="25" fill="#FFFFFF" stroke="#7D8796" stroke-width="2"/><text x="690.0" y="816" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="middle">Подтверждено</text><rect x="560" y="850" width="260" height="50" rx="25" fill="#FFFFFF" stroke="#7D8796" stroke-width="2"/><text x="690.0" y="882" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="middle">Передано мастеру</text><rect x="560" y="916" width="260" height="50" rx="25" fill="#FFFFFF" stroke="#7D8796" stroke-width="2"/><text x="690.0" y="948" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="middle">Ложное</text><rect x="1060" y="817" width="220" height="50" rx="25" fill="#E5F3EA" stroke="#2E8B57" stroke-width="2"/><text x="1170.0" y="849" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="middle">Устранено</text><path d="M310,875 H480 M480,809 V941" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round"/><path d="M480.0,809.0 L548.0,809.0" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#d5-ah17212F)"/><path d="M480.0,875.0 L548.0,875.0" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#d5-ah17212F)"/><path d="M480.0,941.0 L548.0,941.0" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#d5-ah17212F)"/><path d="M820,875 H940" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round"/><path d="M820.0,809.0 L940.0,809.0 L940.0,842.0 L1048.0,842.0" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#d5-ah17212F)"/><path d="M940,875 V842" fill="none" stroke="#17212F" stroke-width="2.5" stroke-linejoin="round"/><path d="M820.0,941.0 L1048.0,941.0" fill="none" stroke="#7D8796" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#d5-ah7D8796)"/><rect x="1060" y="912" width="500" height="58" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="1076" y="943.26" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#17212F" text-anchor="start">доля подтверждённых = точность по сценариям</text><path d="M210.0,900.0 L210.0,926.0" fill="none" stroke="#D33F35" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#d5-ahD33F35)"/><rect x="64" y="938" width="380" height="106" rx="14" fill="#FDECEA" stroke="#D33F35" stroke-width="2"/><text x="80" y="970.82" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#B3261E" text-anchor="start">Эскалация</text><text x="80" y="1000.5400000000001" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B2A26" text-anchor="start">не принято за 2–60 мин по важности</text><text x="80" y="1023.2600000000001" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B2A26" text-anchor="start">→ руководству, охране труда, мастеру</text><rect x="1600" y="784" width="256" height="116" rx="14" fill="#F6F7F9" stroke="#C9D0DA" stroke-width="2"/><text x="1618" y="818.82" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#17212F" text-anchor="start">Журнал и дашборд</text><text x="1618" y="848.5400000000001" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4554" text-anchor="start">фильтры: тип, камера,</text><text x="1618" y="871.2600000000001" font-family="'Golos Text', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4554" text-anchor="start">зона, время; CSV</text></svg>